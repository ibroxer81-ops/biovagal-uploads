function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rx(o){return new RegExp("\\b"+o.replace(/ /g,"\\s+")+"\\b","gi")}
const POOL=PAIRS.map(p=>({p,s:SAYINGS.filter(s=>rx(p[0]).test(s))})).filter(x=>x.s.length);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function remix(){
  const {p,s}=pick(POOL), saying=pick(s);
  const html=esc(saying).replace(rx(p[0]),m=>"<b>"+(m[0]===m[0].toUpperCase()&&m[0]!==m[0].toLowerCase()?cap(p[1]):p[1])+"</b>");
  const frame=pick(FRAMES)(p[2]);
  return {id:frame+"|"+html,frame,html:"“"+html+"”",kind:"Remix"};
}

const STOP=new Set("the and you your for not but all are was with that this have has its it's from what when where who will can how our out one two too into onto them they then than".split(" "));
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}

function setQuery(raw){
  query=raw.trim();const q=query.toLowerCase().replace(/s$/,"");
  qPairs=[];qFuzzy=[];qClassics=[];if(!q)return;
  const grp=Object.keys(GROUPS).filter(k=>k.startsWith(q)||q.startsWith(k)).flatMap(k=>GROUPS[k].split(" "));
  qPairs=POOL.filter(({p})=>grp.includes(p[1])||p[1].toLowerCase().includes(q)||p[2].toLowerCase().includes(q)||(q.length>2&&p[0].toLowerCase()===q));
  qClassics=CLASSICS.filter(c=>c.toLowerCase().includes(q));
  // fuzzy: find words in sayings that sound a bit like the typed word
  const w=q.replace(/[^a-z' -]/g,"");
  if(w.length>=2) SAYINGS.forEach(s=>{
    (s.match(/[A-Za-z']+/g)||[]).forEach(tok=>{
      const t=tok.toLowerCase();if(t.length<3||STOP.has(t)||t===w)return;
      const d=lev(t,w),lim=Math.max(1,Math.floor(Math.max(t.length,w.length)/3));
      const rhyme=t.length>3&&w.length>3&&t.slice(-3)===w.slice(-3);
      if(d<=lim+(w.length<=4?1:0)&&t[0]===w[0]||d<=lim||rhyme||(t.length>=4&&w.startsWith(t.slice(0,3))&&Math.abs(t.length-w.length)<=2))qFuzzy.push([s,tok]);
    });
  });
  if(!qPairs.length&&!qFuzzy.length&&w.length>=3) SAYINGS.forEach(s=>(s.match(/[A-Za-z']+/g)||[]).forEach(tok=>{
    const t=tok.toLowerCase();if(t.length>=3&&t!==w&&!STOP.has(t)&&t.slice(-2)===w.slice(-2))qFuzzy.push([s,tok]);
  }));
}

  const [s,tok]=pick(qFuzzy),word=query;
  const html=esc(s).replace(new RegExp("\\b"+tok+"\\b"),m=>"<b>"+(/[A-Z]/.test(m[0])?cap(word):word)+"</b>");
  const t=/^[A-Z]/.test(word)?word:"a "+word.toLowerCase();
  const frame=pick(FRAMES)(t);
  return {id:frame+"|"+html,frame,html:"“"+html+"”",kind:"Your word"};
}
function queryNext(){
  const opts=[];
  if(qPairs.length)opts.push(()=>{const x=pick(qPairs),saying=pick(x.s),p=x.p;
    const html=esc(saying).replace(rx(p[0]),m=>"<b>"+(/[A-Z]/.test(m[0])?cap(p[1]):p[1])+"</b>");
    const frame=pick(FRAMES)(p[2]);return {id:frame+"|"+html,frame,html:"“"+html+"”",kind:"Remix"}});
  if(qFuzzy.length)opts.push(custom,custom);
  if(qClassics.length)opts.push(()=>{const c=pick(qClassics);return {id:c,frame:"",html:esc(c),kind:"Classic"}});
  let f=pick(opts),g=f();while(!g){f=pick(opts);g=f()}return g;
}

function next(){

  }
  seen.clear();return next();

(function(){try{const q=new URLSearchParams(location.search).get("paid");if(q&&/^cs_/.test(q)){localStorage.setItem("punPaid",q);history.replaceState(null,"",location.pathname);setTimeout(()=>toast("Unlocked. Unlimited puns!"),300)}}catch(e){}})();
let PAID=false;try{PAID=!!localStorage.getItem("punPaid")}catch(e){}
const FULL=!!window.PUNSNUP_FULL||PAID,LIMIT=25,today=new Date().toDateString();
let used=0;try{const u=JSON.parse(localStorage.getItem("punUse")||"{}");used=u.d===today?u.n:0}catch(e){}
function bump(){used++;try{localStorage.setItem("punUse",JSON.stringify({d:today,n:used}))}catch(e){}}
function wall(){if(document.getElementById("wall"))return;const d=document.createElement("div");d.className="card";d.id="wall";
d.innerHTML='<div class="pun">That\u2019s today\u2019s free puns used up.</div><p class="frame" style="margin-top:8px">Endless puns on any word you type, no daily limit. \u00a32.99/month, cancel anytime.</p><div class="row"><a class="appbtn" href="'+PAY+'">Unlock unlimited \u00b7 \u00a32.99/month</a></div><p class="frame" style="margin-top:10px">Already subscribed? <a href="/app/" style="color:var(--accent)">Open unlimited</a> \u00b7 <a href="https://billing.stripe.com/p/login/00w5kF3QE9ZZdi97C50Ny00" style="color:var(--accent)">Manage subscription</a></p>';feed.appendChild(d)}
function more(n=8){if(mode==="favs")return;for(let i=0;i<n;i++){if(!FULL&&used>=LIMIT){wall();break}feed.appendChild(card(next()));made++;if(!FULL)bump()}countEl.textContent=FULL?made+" puns served":Math.max(0,LIMIT-used)+" free puns left today"}
function render(){
  feed.innerHTML="";made=0;
  if(mode==="favs"){countEl.textContent=favs.length+" saved";
    if(!favs.length)feed.innerHTML='<div class="empty">Nothing saved yet. Tap ♡ on a pun you love (or love to hate).</div>';
    favs.forEach(g=>feed.appendChild(card(g)));return}
  more(10);
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  mode=b.dataset.mode;window.scrollTo(0,0);render();
});
document.getElementById("top").onclick=()=>{if(mode==="favs")return;window.scrollTo({top:0});render()};
new IntersectionObserver(e=>{if(e[0].isIntersecting)more()},{rootMargin:"600px"}).observe(document.getElementById("sentinel"));
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1200)}
const qIn=document.getElementById("q"),clr=document.getElementById("clr"),hint=document.getElementById("hint");
function runQuery(){
  setQuery(qIn.value);clr.style.display=query?"block":"none";
  const n=qPairs.length+qFuzzy.length+qClassics.length;
  hint.textContent=!query?"":n?`Puns about “${query}”`:`Couldn't find a sound-alike for “${query}”, so here are random ones. Try a shorter or more common word.`;
  if(mode==="favs"){document.querySelector('[data-mode=all]').click();return}
  seen.clear();window.scrollTo(0,0);render();
}
document.getElementById("qf").onsubmit=e=>{e.preventDefault();qIn.blur();runQuery()};
clr.onclick=()=>{qIn.value="";runQuery()};
qIn.oninput=()=>{clr.style.display=qIn.value?"block":"none"};
if(PAID){const b=document.getElementById("banner");if(b)b.remove()}
try{const q0=new URLSearchParams(location.search).get("q");if(q0){qIn.value=q0.slice(0,40);runQuery()}else render()}catch(e){render()}
</script>
</body>
</html>
